<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Travel Information</title>

  <!-- Official IATA Timatic Widget CSS -->
  <link
    rel="stylesheet"
    href="https://widget.timatic.iata.org/scripts/v2/iata-timatic-style-2.0.0.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: #17202a;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 16px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .header p {
      margin-top: 8px;
      color: #667085;
      font-size: 14px;
    }

    .widget-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    /*
      IATA Timatic Widget customization
    */

    #iata-timatic-widget {
      width: 100%;
      max-width: 100%;
    }

  </style>

  <!-- IATA Timatic configuration -->
  <script>

    /*
      English interface
    */

    window.timaticWidgetLanguage = {
      languageCode: "EN"
    };


    /*
      Operating carrier:
      FZ = flydubai
    */

    window.timaticAgencyDetails = {
      operatingCarrier: "FZ"
    };


    /*
      Show the detailed Timatic search.

      This allows the official widget to display
      the information required by Timatic.
    */

    window.timaticWidgetModes = {
      openInDetailedSearch: true
    };


    /*
      Display the main Timatic information
      sections in a useful order:

      C1 = Visa / Border measures
      C2 = Passport / Travel documents
      C3 = Health / Vaccinations
    */

    window.timaticVisibleSectionOrder = {
      visibleSectionOrder: [
        "C1",
        "C2",
        "C3"
      ]
    };

  </script>

</head>


<body>

  <div class="page">

    <div class="header">

      <h1>
        Travel Information
      </h1>

      <p>
        Official IATA Timatic
      </p>

    </div>


    <div class="widget-card">

      <!-- Official IATA Timatic Widget -->

      <div id="iata-timatic-widget"></div>

    </div>

  </div>


  <!-- Official IATA Timatic Widget JavaScript -->

  <script
    src="https://widget.timatic.iata.org/scripts/v2/iata-timatic-widget-2.0.0.js"
    type="text/javascript"
    defer
  ></script>

</body>

</html>
